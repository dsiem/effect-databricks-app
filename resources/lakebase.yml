resources:
  postgres_projects:
    # These resource keys are deployed bundle-state identities; keep them stable.
    notebook_project:
      project_id: ${var.data_name}
      display_name: ${var.data_name} saved views
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 1
        autoscaling_limit_max_cu: 1
        suspend_timeout_duration: 300s
  postgres_branches:
    notebook_branch:
      parent: ${resources.postgres_projects.notebook_project.name}
      branch_id: production
      replace_existing: true
      no_expiry: true
  postgres_endpoints:
    notebook_endpoint:
      parent: ${resources.postgres_branches.notebook_branch.name}
      endpoint_id: primary
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      replace_existing: true
      autoscaling_limit_min_cu: 1
      autoscaling_limit_max_cu: 1
