resources:
  jobs:
    seed_trip_snapshot:
      name: ${var.data_name}-seed-trip-snapshot
      description: Full Jan-Feb 2016 taxi ingestion, quality audit, ZIP enrichment, and app grants; preserves trip IDs on rerun.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${resources.schemas.data.catalog_name}
        - name: schema
          default: ${resources.schemas.data.name}
        - name: app_service_principal_id
          default: ""
      tasks:
        - task_key: seed_trip_snapshot
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../jobs/seed-trip-snapshot.sql
            warehouse_id: ${resources.sql_warehouses.analytics.id}
    route_reliability:
      name: ${var.data_name}-route-reliability
      description: Compare p90 trip durations by pickup ZIP, drop-off ZIP, and time of day across two weeks.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: baseline_week
          default: "2016-01-04"
        - name: comparison_week
          default: "2016-01-11"
        - name: minimum_trips
          default: "50"
      tasks:
        - task_key: compare_routes
          sql_task:
            warehouse_id: ${resources.sql_warehouses.analytics.id}
            file:
              path: ${workspace.file_path}/jobs/route-reliability.sql
              source: WORKSPACE
            parameters:
              analysis_run_id: "{{job.run_id}}"
              snapshot_table: "`${resources.schemas.data.catalog_name}`.`${resources.schemas.data.name}`.`trips_2016`"
              results_table: "`${resources.schemas.data.catalog_name}`.`${resources.schemas.data.name}`.`route_reliability_runs`"
