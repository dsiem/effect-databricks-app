resources:
  jobs:
    seed_trip_snapshot:
      name: ${var.data_name}-seed-trip-snapshot
      description: Ingest NYC taxi trips for a pickup date range, audit source quality, and enrich trips with ZIP codes.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${resources.schemas.data.catalog_name}
        - name: schema
          default: ${resources.schemas.data.name}
        - name: snapshot_start_date
          default: ${var.snapshot_start_date}
        - name: snapshot_end_date
          default: ${var.snapshot_end_date}
      tasks:
        - task_key: copy_geography
          environment_key: copy_geography
          timeout_seconds: 600
          spark_python_task:
            python_file: ../jobs/copy-geography.py
            parameters:
              - ${workspace.file_path}/jobs/nyc-zcta.jsonl
              - /Volumes/${resources.volumes.taxi_sources.catalog_name}/${resources.volumes.taxi_sources.schema_name}/${resources.volumes.taxi_sources.name}/nyc-zcta.jsonl
        - task_key: seed_trip_snapshot
          depends_on:
            - task_key: copy_geography
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ../jobs/seed-trip-snapshot.sql
            warehouse_id: ${resources.sql_warehouses.analytics.id}
      environments:
        - environment_key: copy_geography
          spec:
            environment_version: "5"
    grant_trip_access:
      name: ${var.data_name}-grant-trip-access
      description: Give the app read access to the published taxi data and analysis results.
      parameters:
        - name: catalog
          default: ${resources.schemas.data.catalog_name}
        - name: schema
          default: ${resources.schemas.data.name}
        - name: app_service_principal_id
          default: ""
      tasks:
        - task_key: grant_trip_access
          timeout_seconds: 600
          notebook_task:
            notebook_path: ../jobs/grant-trip-access.sql
            warehouse_id: ${resources.sql_warehouses.analytics.id}
    route_reliability:
      name: ${var.data_name}-route-reliability
      description: Compare p90 trip durations by pickup ZIP, drop-off ZIP, and time of day across two weeks.
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: baseline_week
          default: "2016-01-04"
        - name: comparison_week
          default: "2016-01-11"
        - name: minimum_trips
          default: "50"
        - name: requested_by
          default: ""
      tasks:
        - task_key: compare_routes
          sql_task:
            warehouse_id: ${resources.sql_warehouses.analytics.id}
            file:
              path: ${workspace.file_path}/jobs/route-reliability.sql
              source: WORKSPACE
            parameters:
              analysis_run_id: "{{job.run_id}}"
              snapshot_table: "`${resources.schemas.data.catalog_name}`.`${resources.schemas.data.name}`.`trips`"
              results_table: "`${resources.schemas.data.catalog_name}`.`${resources.schemas.data.name}`.`route_reliability_runs`"
