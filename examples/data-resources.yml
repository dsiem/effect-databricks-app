# Opt-in example only. After selecting resources, copy the variables and
# resources.apps.app.resources into databricks.yml. See docs/data-access.md.
variables:
  sql_warehouse_id:
    description: Existing SQL warehouse ID.
  genie_space_id:
    description: Existing Genie space ID.
  genie_space_name:
    description: Existing Genie space display name.
  lakebase_branch:
    description: Lakebase Autoscaling branch resource name (projects/PROJECT/branches/BRANCH).
  lakebase_database:
    description: Lakebase database name.

resources:
  apps:
    app:
      resources:
        - name: lakehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_VIEW
        - name: lakebase
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
