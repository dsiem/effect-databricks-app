bundle:
  name: databricks-effect-app
  databricks_cli_version: ">= 1.26.0, < 2.0.0"

variables:
  app_name:
    description: Unique app name (lowercase letters, digits, hyphens; at most 30 characters).
    default: metrocab-dev
  data_name:
    description: Prefix for the data resources managed by this bundle target.
    default: metrocab-${bundle.target}
  data_catalog:
    description: Unity Catalog catalog for the processed NYC taxi dataset.
    default: workspace
  data_schema:
    description: Unity Catalog schema for the processed NYC taxi dataset.
    default: ${var.data_name}

  warehouse_name:
    description: Display name of the managed warehouse; set when adopting an existing warehouse.
    default: ${var.data_name}-analytics

resources:
  schemas:
    data:
      name: ${var.data_schema}
      catalog_name: ${var.data_catalog}
      comment: Full January-February 2016 NYC taxi source, quality checks, and enriched trips.
  volumes:
    taxi_sources:
      name: taxi_sources
      catalog_name: ${resources.schemas.data.catalog_name}
      schema_name: ${resources.schemas.data.name}
      volume_type: MANAGED
      comment: Pinned geographic boundaries for reproducible taxi enrichment.
  sql_warehouses:
    analytics:
      name: ${var.warehouse_name}
      cluster_size: 2X-Small
      warehouse_type: PRO
      enable_serverless_compute: true
      enable_photon: true
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
      tags: {}
  jobs:
    seed_trip_snapshot:
      name: ${var.data_name}-seed-trip-snapshot
      description: Full Jan-Feb 2016 taxi ingestion, quality audit, ZIP enrichment, and app grants; preserves trip IDs on rerun.
      max_concurrent_runs: 1
      parameters:
        - name: catalog
          default: ${resources.schemas.data.catalog_name}
        - name: schema
          default: ${resources.schemas.data.name}
        - name: app_service_principal_id
          default: ""
      tasks:
        - task_key: seed_trip_snapshot
          timeout_seconds: 3600
          notebook_task:
            notebook_path: ./jobs/seed-trip-snapshot.sql
            warehouse_id: ${resources.sql_warehouses.analytics.id}
  genie_spaces:
    taxi:
      title: ${var.app_name} NYC taxi analyst
      description: Historical NYC taxi analytics with source-grounded SQL.
      warehouse_id: ${resources.sql_warehouses.analytics.id}
      serialized_space: |
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "01f1df70000000000000000000000001",
                "question": [
                  "Which pickup ZIP codes have the most trips?"
                ]
              },
              {
                "id": "01f1df70000000000000000000000002",
                "question": [
                  "How does the average fare change by hour of day?"
                ]
              },
              {
                "id": "01f1df70000000000000000000000003",
                "question": [
                  "Show total trips and fare revenue by month."
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.data_catalog}.${var.data_schema}.trip_quality_2016",
                "description": [
                  "Full-source monthly ingestion counts: raw, accepted, rejected and accepted trips missing GPS. These file-level counts do not support arbitrary date/ZIP filters."
                ]
              },
              {
                "identifier": "${var.data_catalog}.${var.data_schema}.trips_2016"
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "01f1df70000000000000000000000004",
                "content": [
                  "Use the configured trips_2016 table: full January-February 2016 NYC yellow taxi source files, with invalid trip records excluded from analytics. Each row is a trip with a persisted trip_id; source_file provides lineage. All 19 original fields are retained. tpep_pickup_datetime and tpep_dropoff_datetime are local New York wall-clock times stored as TIMESTAMP_NTZ, not UTC instants. fare_amount is USD excluding tips and tolls; SUM(fare_amount) is fare revenue. total_amount includes the recorded fare, taxes, tips, tolls and surcharges; cash tips are absent from tip_amount and total_amount. trip_distance is miles. Passenger counts are driver-reported; payment_type: 1 credit card, 2 cash, 3 no charge, 4 dispute, 5 unknown, 6 voided. VendorID identifies the technology provider, not the driver or taxi. RatecodeID is the rate type. GPS coordinates are recorded endpoints, not a driven route. Only use pickup/dropoff coordinates for maps when the corresponding pickup_coordinates_valid/dropoff_coordinates_valid flag is true. These flags use a broad NYC-region box: longitude [-75,-72], latitude [40,42]. ZIP codes are derived by point-in-polygon against the pinned Census 2020 ZCTA geometry distributed by NYC, not recorded postal addresses or historical 2016 boundaries. Unknown ZIPs remain NULL, including trips outside the boundary coverage. Trips with missing GPS are retained if other trip fields pass validation. Accepted trips have pickup in Jan-Feb 2016, positive distance and fare, and duration greater than zero and no more than 24 hours; all source records remain in the engineering table trips_2016_raw. The attached trip_quality_2016 view provides full-file quality counts. State its full-source scope explicitly; those counts cannot be narrowed to arbitrary date or ZIP filters. Do not assume current dates. User to dates are inclusive; duration minutes is timestampdiff(SECOND,tpep_pickup_datetime,tpep_dropoff_datetime)/60.0. Do not invent identities, ratings, explanations or routes. Read-only analytics only. The GPS activity map groups matching trips into H3 resolution-10 cells for the selected pickup or dropoff endpoint, requiring its corresponding coordinates_valid flag. Area IDs use h3_h3tostring(h3_longlatash3(endpoint_longitude,endpoint_latitude,10)). When analyzing a selected GPS area, restrict further queries to its cell ID, endpoint and current pickup date/ZIP filters. The area center is derived from the cell, not an individual recorded endpoint. Use the supplied located, shown and matching trip counts to explain coverage and any truncation."
                ]
              }
            ]
          }
        }
  postgres_projects:
    # These resource keys are deployed bundle-state identities; keep them stable.
    notebook_project:
      project_id: ${var.data_name}
      display_name: ${var.data_name} saved views
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 1
        autoscaling_limit_max_cu: 1
        suspend_timeout_duration: 300s
  postgres_branches:
    notebook_branch:
      parent: ${resources.postgres_projects.notebook_project.name}
      branch_id: production
      replace_existing: true
      no_expiry: true
  postgres_endpoints:
    notebook_endpoint:
      parent: ${resources.postgres_branches.notebook_branch.name}
      endpoint_id: primary
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      replace_existing: true
      autoscaling_limit_min_cu: 1
      autoscaling_limit_max_cu: 1
  apps:
    app:
      name: ${var.app_name}
      description: NYC taxi analytics, Genie, and Lakebase saved views, composed with Effect.
      source_code_path: .
      config:
        command: [node, dist/src/main.js]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: lakehouse
          - name: TRIP_SNAPSHOT_TABLE
            value: ${resources.schemas.data.catalog_name}.${resources.schemas.data.name}.trips_2016
          - name: GENIE_SPACE_ID
            value_from: genie
          - name: LAKEBASE_ENDPOINT
            value_from: lakebase
          - name: PGDATABASE
            value: databricks_postgres
      resources:
        - name: lakehouse
          sql_warehouse:
            id: ${resources.sql_warehouses.analytics.id}
            permission: CAN_USE
        - name: genie
          genie_space:
            name: ${resources.genie_spaces.taxi.title}
            space_id: ${resources.genie_spaces.taxi.id}
            permission: CAN_RUN
        - name: lakebase
          postgres:
            branch: ${resources.postgres_branches.notebook_branch.name}
            database: ${resources.postgres_branches.notebook_branch.name}/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

sync:
  exclude:
    - .github/**
    - docs/**
    - design/**
    - examples/**
    - scripts/**
    - test/**
    - e2e/**
    - config/**
    - jobs/nyc-zcta.jsonl
    - README.md
    - biome.json
    - playwright.config.ts

targets:
  dev:
    default: true
    variables:
      app_name: metrocab-dev
  prod:
    mode: production
    variables:
      app_name: databricks-effect-app
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
