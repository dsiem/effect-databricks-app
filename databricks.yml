bundle:
  name: databricks-effect-app
  databricks_cli_version: ">= 1.26.0, < 2.0.0"

variables:
  app_name:
    description: Unique app name (lowercase letters, digits, hyphens; at most 30 characters).
    default: ${bundle.name}-${bundle.target}
  data_name:
    description: Prefix for the data resources managed by this bundle target.
    default: ${bundle.name}-${bundle.target}
  data_catalog:
    description: Unity Catalog catalog for the processed NYC taxi dataset.
    default: workspace
  data_schema:
    description: Unity Catalog schema for the processed NYC taxi dataset.
    default: ${var.data_name}

  warehouse_name:
    description: Display name of the SQL warehouse.
    default: ${var.data_name}-analytics

include:
  - resources/*.yml

scripts:
  bootstrap:
    env:
      BUNDLE_TARGET: ${bundle.target}
      BUNDLE_VAR_app_name: ${var.app_name}
      BUNDLE_VAR_data_name: ${var.data_name}
      BUNDLE_VAR_data_catalog: ${var.data_catalog}
      BUNDLE_VAR_data_schema: ${var.data_schema}
      BUNDLE_VAR_warehouse_name: ${var.warehouse_name}
    content: node scripts/setup-workspace.mjs bootstrap
  local_env:
    env:
      BUNDLE_TARGET: ${bundle.target}
    content: node scripts/setup-workspace.mjs local-env

sync:
  exclude:
    - .github/**
    - scripts/**
    - test/**
    - server/test/**
    - client/test/**
    - packages/*/test/**
    - README.md
    - DEPLOYMENT.md
    - .oxlintrc.json
    - .oxfmtrc.json
    - playwright.config.ts

targets:
  dev:
    default: true
  prod:
    mode: production
    variables:
      app_name: ${bundle.name}
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
